# The guards, on every push and pull request.
#
# They were only ever run by hand: `npm run guard` is not part of `build`, so
# a retyped corpus figure or a British spelling reached production without
# anything objecting. This runs the same command on every push so it objects
# on the pull request instead.
#
# CMS credentials (2026-10-05): the CMS publishing gate and the dataset-figure
# guard's Sanity pass used to SKIP here for lack of them, so CMS content was
# never checked in CI. The project ID and dataset are public (sanity/env.ts).
# SANITY_API_TOKEN is a read-only Viewer token in the repo secrets; it is
# needed because docs with dotted IDs (page.about and the like) are private.
name: Guards

on:
  push:
    branches: [master]
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # @datazag/site-chrome (shared header and footer) comes from GitHub
      # Packages. NPM_TOKEN is a repo secret: a token with read:packages.
      - run: npm ci --legacy-peer-deps
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm run guard
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: w8wq190o
          NEXT_PUBLIC_SANITY_DATASET: production
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
