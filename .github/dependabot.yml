# Opens a PR here whenever a new @datazag/site-chrome (shared header, footer,
# nav and tokens) is published, so a nav change reaches the site with no code
# change. DEPENDABOT_PACKAGES_TOKEN is a Dependabot secret (Settings → Secrets
# → Dependabot): a token with read:packages.
version: 2
registries:
  github-packages:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{ secrets.DEPENDABOT_PACKAGES_TOKEN }}
updates:
  - package-ecosystem: npm
    directory: /
    registries:
      - github-packages
    schedule:
      interval: daily
    allow:
      - dependency-name: "@datazag/site-chrome"
    commit-message:
      prefix: "site-chrome"
